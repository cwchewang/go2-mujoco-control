name: Temporary Go2 origin repair

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  repair-origin:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.issue.title == 'Fix Go2 current origin now' &&
      github.event.issue.author_association == 'OWNER'
    runs-on: [self-hosted, linux, x64, atlas]
    timeout-minutes: 10
    steps:
      - name: Repair only Go2 common-repo origin
        shell: bash
        run: |
          set -euo pipefail
          repo="/home/che/dev/go2-workspace/current"
          old="https://github.com/kairoi-k/go2-mujoco-control.git"
          new="https://github.com/cwchewang/go2-mujoco-control.git"

          test "$(git -C "$repo" rev-parse --is-inside-work-tree)" = "true"
          before="$(git -C "$repo" remote get-url origin)"
          test "$before" = "$old"

          status_before="$(git -C "$repo" status --porcelain)"
          git ls-remote --exit-code "$new" HEAD >/dev/null
          git -C "$repo" remote set-url origin "$new"
          after="$(git -C "$repo" remote get-url origin)"
          test "$after" = "$new"
          status_after="$(git -C "$repo" status --porcelain)"
          test "$status_before" = "$status_after"

          echo "GIT_COMMON_DIR=$(git -C "$repo" rev-parse --git-common-dir)"
          echo "ORIGIN_BEFORE=$before"
          echo "ORIGIN_AFTER=$after"

      - name: Close repair issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "Go2 current/common-repo origin repaired to cwchewang/go2-mujoco-control."
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason completed
