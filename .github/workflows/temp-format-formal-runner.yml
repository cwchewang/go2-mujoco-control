name: Temporary formal-runner formatter
on:
  push:
    branches:
      - research/shared-transfer-formal-runner-20260923
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: research/shared-transfer-formal-runner-20260923
      - run: python3 -m pip install ruff==0.12.12
      - run: python3 -m ruff format example/cpp/tools/run_shared_transfer_formal.py
      - run: |
          if git diff --quiet -- example/cpp/tools/run_shared_transfer_formal.py; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add example/cpp/tools/run_shared_transfer_formal.py
          git commit -m "style: format shared-transfer formal runner"
          git push origin HEAD:research/shared-transfer-formal-runner-20260923
