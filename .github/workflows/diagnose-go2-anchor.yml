name: Diagnose Go2 workspace anchor

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  diagnose:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.issue.title == 'Diagnose Go2 workspace anchor' &&
      github.event.issue.author_association == 'OWNER'
    runs-on: [self-hosted, linux, x64, atlas]
    timeout-minutes: 10
    steps:
      - name: Inspect expected and surviving Go2 paths
        shell: bash
        run: |
          set -u
          echo "HOME=$HOME"
          echo "PWD=$PWD"
          echo "=== expected path chain ==="
          for p in "$HOME/dev" "$HOME/dev/go2-workspace" "$HOME/dev/go2-workspace/current" "$HOME/dev/go2-agent" "$HOME/dev/go2-agent/tasks"; do
            if [[ -e "$p" || -L "$p" ]]; then
              stat -c '%F %n inode=%i mtime=%y' "$p" || true
              if [[ -L "$p" ]]; then readlink -v "$p" || true; fi
            else
              echo "MISSING $p"
            fi
          done
          echo "=== likely Go2/workspace survivors under HOME ==="
          find "$HOME" -maxdepth 6 \( -type d -o -type l \) \
            \( -name 'go2-mujoco-control' -o -name 'go2-workspace' -o -name 'go2-agent' -o -name 'current' \) \
            -printf '%y %p -> %l\n' 2>/dev/null | sort | head -n 200
          echo "=== runner workspaces ==="
          find "$HOME" -maxdepth 6 -type d -path '*/_work/go2-mujoco-control/go2-mujoco-control' \
            -printf '%p\n' 2>/dev/null | sort | head -n 50
