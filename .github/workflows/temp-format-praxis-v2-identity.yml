name: Temporary Praxis-v2 identity formatter

on:
  push:
    branches:
      - research/praxis-v2-identity-acceptance-20260923

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: research/praxis-v2-identity-acceptance-20260923
      - run: python3 -m pip install ruff==0.12.12
      - run: python3 -m ruff format tools/research/identity.py tools/substrate/test_launch.py
      - run: |
          if git diff --quiet -- tools/research/identity.py tools/substrate/test_launch.py; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/research/identity.py tools/substrate/test_launch.py
          git commit -m "style: format Praxis v2 identity acceptance"
          git push origin HEAD:research/praxis-v2-identity-acceptance-20260923
