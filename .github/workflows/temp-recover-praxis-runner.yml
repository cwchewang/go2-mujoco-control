name: Temporary Praxis Atlas runner recovery

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  recover:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.issue.title == 'Recover Praxis Atlas runner now' &&
      github.event.issue.author_association == 'OWNER'
    runs-on: [self-hosted, linux, x64, atlas]
    timeout-minutes: 10
    steps:
      - name: Restart only Praxis runner service
        shell: bash
        run: |
          set -euo pipefail
          uid="$(id -u)"
          if [[ -S "/run/user/$uid/bus" ]]; then
            export XDG_RUNTIME_DIR="/run/user/$uid"
            export DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$uid/bus"
          fi
          echo "BEFORE=$(systemctl --user is-active praxis-runner-atlas.service 2>/dev/null || true)"
          systemctl --user restart praxis-runner-atlas.service
          for _ in $(seq 1 30); do
            if systemctl --user is-active --quiet praxis-runner-atlas.service; then
              echo "AFTER=active"
              systemctl --user status praxis-runner-atlas.service --no-pager -n 20 || true
              exit 0
            fi
            sleep 1
          done
          systemctl --user status praxis-runner-atlas.service --no-pager -n 40 || true
          exit 1

      - name: Close recovery issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "Praxis Atlas runner service restarted successfully."
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason completed
