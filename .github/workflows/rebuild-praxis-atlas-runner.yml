name: Rebuild Praxis Atlas runner

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

jobs:
  repair:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.issue.title == 'Rebuild Praxis Atlas runner' &&
      github.event.issue.author_association == 'OWNER'
    runs-on: [self-hosted, linux, x64, atlas]
    timeout-minutes: 20
    steps:
      - name: Rebuild praxis-atlas in a fresh root
        shell: bash
        env:
          TARGET_REPO: cwchewang/praxis-research-runtime
          TARGET_NAME: praxis-atlas
          SERVICE_NAME: praxis-runner-atlas.service
          RUNNER_VERSION: "2.337.0"
        run: |
          set -euo pipefail
          umask 077
          export PATH="$HOME/bin:$HOME/.local/bin:$PATH"
          command -v gh >/dev/null 2>&1
          gh auth status -h github.com >/dev/null 2>&1
          gh api "repos/$TARGET_REPO" --silent

          target_dir="$HOME/.local/share/praxis/runner-fresh"
          canonical_dir="$HOME/.local/share/praxis/runner"
          promote_canonical() {
            if [[ -L "$canonical_dir" && "$(readlink -f "$canonical_dir")" == "$(readlink -f "$target_dir")" ]]; then
              return 0
            fi
            if [[ -e "$canonical_dir" || -L "$canonical_dir" ]]; then
              backup="$HOME/.local/share/praxis/runner-legacy-$GITHUB_RUN_ID-$(date +%s)"
              mv "$canonical_dir" "$backup"
              echo "PRAXIS_ATLAS_LEGACY_ROOT=$backup"
            fi
            ln -s "$target_dir" "$canonical_dir"
          }

          current_status="$(gh api "repos/$TARGET_REPO/actions/runners?per_page=100" --jq '.runners[] | select(.name=="'"$TARGET_NAME"'") | .status' | head -n1 || true)"
          if [[ "$current_status" == "online" ]]; then
            if [[ -f "$target_dir/.runner" ]]; then
              promote_canonical
              echo "PRAXIS_ATLAS_REBUILD=ALREADY_ONLINE_CANONICALIZED"
            else
              echo "PRAXIS_ATLAS_REBUILD=ALREADY_ONLINE"
            fi
            exit 0
          fi

          uid="$(id -u)"
          if [[ -S "/run/user/$uid/bus" ]]; then
            export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$uid}"
            export DBUS_SESSION_BUS_ADDRESS="${DBUS_SESSION_BUS_ADDRESS:-unix:path=/run/user/$uid/bus}"
          fi
          systemctl --user kill --kill-whom=all --signal=KILL "$SERVICE_NAME" >/dev/null 2>&1 || true
          systemctl --user reset-failed "$SERVICE_NAME" >/dev/null 2>&1 || true

          rm -rf "$target_dir"
          mkdir -p "$target_dir"
          asset="actions-runner-linux-x64-$RUNNER_VERSION.tar.gz"
          meta="$(mktemp)"
          archive="$(mktemp)"
          cleanup() { rm -f "$meta" "$archive"; }
          trap cleanup EXIT
          curl -fsSL "https://api.github.com/repos/actions/runner/releases/tags/v$RUNNER_VERSION" -o "$meta"
          python3 -c 'import hashlib,json,sys,urllib.request; meta,name,out=sys.argv[1:]; data=json.load(open(meta)); a=next(x for x in data["assets"] if x["name"]==name); open(out,"wb").write(urllib.request.urlopen(a["browser_download_url"]).read()); d=a.get("digest"); actual="sha256:"+hashlib.sha256(open(out,"rb").read()).hexdigest(); (not d or actual==d) or (_ for _ in ()).throw(SystemExit("runner archive digest mismatch"))' "$meta" "$asset" "$archive"
          tar -xzf "$archive" -C "$target_dir"

          reg_token="$(gh api --method POST "repos/$TARGET_REPO/actions/runners/registration-token" --jq .token)"
          (cd "$target_dir" && ./config.sh --unattended --replace --url "https://github.com/$TARGET_REPO" --token "$reg_token" --name "$TARGET_NAME" --labels atlas --work _work >/dev/null)
          unset reg_token
          promote_canonical

          unit_dir="$HOME/.config/systemd/user"
          unit="$unit_dir/$SERVICE_NAME"
          mkdir -p "$unit_dir"
          {
            echo '[Unit]'
            echo 'Description=Praxis machine runner (atlas)'
            echo 'After=network-online.target'
            echo 'Wants=network-online.target'
            echo
            echo '[Service]'
            echo 'Type=simple'
            echo "WorkingDirectory=$canonical_dir"
            echo "ExecStart=$canonical_dir/bin/runsvc.sh"
            echo 'Environment=ACTIONS_RUNNER_SVC=1'
            echo 'Restart=always'
            echo 'RestartSec=5'
            echo 'TimeoutStopSec=10'
            echo
            echo '[Install]'
            echo 'WantedBy=default.target'
          } > "$unit"

          for proxy_var in HTTP_PROXY HTTPS_PROXY ALL_PROXY NO_PROXY http_proxy https_proxy all_proxy no_proxy; do
            if [[ -n "${!proxy_var:-}" ]]; then
              systemctl --user set-environment "$proxy_var=${!proxy_var}"
            fi
          done
          systemctl --user daemon-reload
          systemctl --user enable "$SERVICE_NAME" >/dev/null
          systemctl --user start --no-block "$SERVICE_NAME"

          for _ in $(seq 1 30); do
            status="$(gh api "repos/$TARGET_REPO/actions/runners?per_page=100" --jq '.runners[] | select(.name=="'"$TARGET_NAME"'") | .status' | head -n1 || true)"
            if [[ "$status" == "online" ]]; then
              echo "PRAXIS_ATLAS_REBUILD=REGISTERED_AND_ONLINE"
              exit 0
            fi
            sleep 2
          done

          echo "PRAXIS_ATLAS_REBUILD=FAILED_TO_GO_ONLINE" >&2
          systemctl --user status "$SERVICE_NAME" --no-pager || true
          journalctl --user -u "$SERVICE_NAME" -n 80 --no-pager || true
          exit 25

      - name: Close repair issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "Praxis Atlas runner rebuilt and verified online."
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason completed
