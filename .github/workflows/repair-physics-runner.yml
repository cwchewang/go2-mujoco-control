name: Repair physics runner from Atlas

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  repair:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.issue.title == 'Repair Atlas physics runner' &&
      github.event.issue.author_association == 'OWNER'
    runs-on: [self-hosted, linux, x64, atlas]
    timeout-minutes: 20
    steps:
      - name: Repair atlas-physics registration and user service
        shell: bash
        env:
          TARGET_REPO: cwchewang/physics-knowledge-for-control
          TARGET_NAME: atlas-physics
          SERVICE_NAME: actions-runner-physics.service
        run: |
          set -euo pipefail
          umask 077

          target_dir="$HOME/actions-runners/physics-knowledge-for-control"
          test -x "$target_dir/config.sh"
          test -x "$target_dir/run.sh"
          command -v gh >/dev/null 2>&1
          gh auth status -h github.com >/dev/null 2>&1
          gh api "repos/$TARGET_REPO" --silent

          current_status="$(gh api "repos/$TARGET_REPO/actions/runners?per_page=100" --jq '.runners[] | select(.name=="'"$TARGET_NAME"'") | .status' | head -n1 || true)"
          if [[ "$current_status" == "online" ]]; then
            echo "ATLAS_PHYSICS_REPAIR=ALREADY_ONLINE"
            exit 0
          fi

          if [[ -f "$target_dir/.runner" ]]; then
            remove_token="$(gh api --method POST "repos/$TARGET_REPO/actions/runners/remove-token" --jq .token)"
            (cd "$target_dir" && ./config.sh remove --token "$remove_token" >/dev/null)
            unset remove_token
          fi

          reg_token="$(gh api --method POST "repos/$TARGET_REPO/actions/runners/registration-token" --jq .token)"
          (cd "$target_dir" && ./config.sh --unattended --replace --url "https://github.com/$TARGET_REPO" --token "$reg_token" --name "$TARGET_NAME" --labels atlas --work _work >/dev/null)
          unset reg_token

          unit_dir="$HOME/.config/systemd/user"
          unit="$unit_dir/$SERVICE_NAME"
          mkdir -p "$unit_dir"
          {
            echo '[Unit]'
            echo 'Description=GitHub Actions Runner - physics-knowledge-for-control'
            echo 'After=network-online.target'
            echo 'Wants=network-online.target'
            echo
            echo '[Service]'
            echo 'Type=simple'
            echo "WorkingDirectory=$target_dir"
            echo "ExecStart=$target_dir/run.sh"
            echo 'Restart=always'
            echo 'RestartSec=5'
            echo
            echo '[Install]'
            echo 'WantedBy=default.target'
          } > "$unit"

          uid="$(id -u)"
          if [[ -S "/run/user/$uid/bus" ]]; then
            export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$uid}"
            export DBUS_SESSION_BUS_ADDRESS="${DBUS_SESSION_BUS_ADDRESS:-unix:path=/run/user/$uid/bus}"
          fi

          for proxy_var in HTTP_PROXY HTTPS_PROXY ALL_PROXY NO_PROXY http_proxy https_proxy all_proxy no_proxy; do
            if [[ -n "${!proxy_var:-}" ]]; then
              systemctl --user set-environment "$proxy_var=${!proxy_var}"
            fi
          done

          systemctl --user daemon-reload
          systemctl --user enable "$SERVICE_NAME" >/dev/null
          systemctl --user restart "$SERVICE_NAME"

          for _ in $(seq 1 30); do
            status="$(gh api "repos/$TARGET_REPO/actions/runners?per_page=100" --jq '.runners[] | select(.name=="'"$TARGET_NAME"'") | .status' | head -n1 || true)"
            if [[ "$status" == "online" ]]; then
              echo "ATLAS_PHYSICS_REPAIR=REGISTERED_AND_ONLINE"
              exit 0
            fi
            sleep 2
          done

          echo "ATLAS_PHYSICS_REPAIR=FAILED_TO_GO_ONLINE" >&2
          systemctl --user status "$SERVICE_NAME" --no-pager || true
          journalctl --user -u "$SERVICE_NAME" -n 60 --no-pager || true
          exit 25

      - name: Close repair issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "Atlas physics runner repair completed successfully."
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason completed
