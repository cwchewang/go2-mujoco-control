name: Repository hygiene

on:
  pull_request:
  workflow_dispatch:

jobs:
  portable-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install pinned quality tooling
        run: python3 -m pip install --require-hashes -r tools/requirements-dev-linux-x86_64.txt
      - name: Check tracked-source syntax, formatting, lint and links
        run: python3 -m tools.check_quality --style
      - name: Check generated frontier navigation
        run: python3 -m tools.research.workspace --check
      - name: Install substrate contract test dependency
        run: python3 -m pip install numpy==2.2.6
      - name: Run portable substrate contract tests
        run: python3 -m unittest tools.substrate.test_substrate tools.substrate.test_reliability tools.substrate.test_clock tools.substrate.test_launch tools.substrate.test_qualification tools.substrate.test_baseline tools.research.test_preflight tools.research.test_preflight_integration -v
      - name: Run repository and Atlas contract tests
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py'

# Hosted CI intentionally does not claim MuJoCo, Unitree SDK, simulator, or
# sim-to-real integration. Those require the documented WSL environment.
