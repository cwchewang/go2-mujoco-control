name: Atlas task dispatcher

on:
  issues:
    types: [opened, reopened, labeled]

permissions:
  contents: write
  issues: write

jobs:
  dispatch:
    if: >-
      github.event.issue.pull_request == null &&
      contains(github.event.issue.labels.*.name, 'atlas-task') &&
      (github.event.action != 'labeled' || github.event.label.name == 'atlas-task') &&
      (github.event.issue.author_association == 'OWNER' ||
       github.event.issue.author_association == 'MEMBER' ||
       github.event.issue.author_association == 'COLLABORATOR')
    uses: kairoi-k/go2-research-orchestrator/.github/workflows/atlas-dispatch-reusable.yml@2d0e2f1e4245a6ccf4aae47a81171d40a16ef0d0
    with:
      project-config: .atlas/project.json
      core-ref: 2d0e2f1e4245a6ccf4aae47a81171d40a16ef0d0
