name: Praxis task dispatcher

on:
  issues:
    types: [opened, reopened, labeled]

permissions:
  contents: write
  issues: write

jobs:
  dispatch:
    if: >-
      github.event.issue.pull_request == null &&
      contains(github.event.issue.labels.*.name, 'atlas-task') &&
      (github.event.action != 'labeled' || github.event.label.name == 'atlas-task') &&
      (github.event.issue.author_association == 'OWNER' ||
       github.event.issue.author_association == 'MEMBER' ||
       github.event.issue.author_association == 'COLLABORATOR')
    uses: cwchewang/praxis-research-runtime/.github/workflows/atlas-dispatch-reusable.yml@55ff70d26d8b919c5f4190a91e00979832497e75
    with:
      project-config: .atlas/project.json
      core-ref: 55ff70d26d8b919c5f4190a91e00979832497e75
