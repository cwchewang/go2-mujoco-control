name: Praxis task dispatcher

on:
  issues:
    types: [opened, reopened, labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: praxis-dispatch-${{ github.repository }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event.issue.pull_request == null &&
      contains(github.event.issue.labels.*.name, 'atlas-task') &&
      (github.event.action != 'labeled' || github.event.label.name == 'atlas-task') &&
      (github.event.issue.author_association == 'OWNER' ||
       github.event.issue.author_association == 'MEMBER' ||
       github.event.issue.author_association == 'COLLABORATOR')
    runs-on: [self-hosted, linux, x64, atlas]
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      ATLAS_MAX_WORKERS: "4"
    steps:
      - name: Checkout project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Add user-local binaries to PATH
        shell: bash
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run trusted project-local dispatcher
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/praxis-dispatch"
          python3 tools/atlas_dispatch_v2.py \
            --event "$GITHUB_EVENT_PATH" \
            --output-dir "$RUNNER_TEMP/praxis-dispatch"

      - name: Upload Praxis dispatcher evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: praxis-dispatch-${{ github.run_id }}
          path: ${{ runner.temp }}/praxis-dispatch
          if-no-files-found: warn
          retention-days: 14
