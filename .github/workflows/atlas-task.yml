name: Praxis task dispatcher

on:
  issues:
    types: [opened, reopened, labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: praxis-dispatch-go2-canonical-${{ github.repository }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event.issue.pull_request == null &&
      contains(github.event.issue.labels.*.name, 'atlas-task') &&
      (github.event.action != 'labeled' || github.event.label.name == 'atlas-task') &&
      (github.event.issue.author_association == 'OWNER' ||
       github.event.issue.author_association == 'MEMBER' ||
       github.event.issue.author_association == 'COLLABORATOR')
    runs-on: [self-hosted, linux, x64, atlas]
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      ATLAS_MACHINE_MAX_WORKERS: "4"
      PRAXIS_CORE_REF: 1594778e2a15a8fe9dcee8b4985d971a8d5110b2
      GO2_CANONICAL_REPO: https://github.com/cwchewang/go2-mujoco-control.git
      GO2_PRAXIS_ANCHOR_REL: dev/go2-workspace/praxis-anchor
      GO2_PRAXIS_TASKS_REL: dev/go2-praxis/tasks
      GO2_PRAXIS_STATE_REL: .local/state/praxis-go2-worker
    steps:
      - name: Materialize pinned private Praxis core
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          command -v gh >/dev/null 2>&1
          env -u GITHUB_TOKEN -u GH_TOKEN gh auth status -h github.com >/dev/null 2>&1
          core="$RUNNER_TEMP/praxis-core"
          rm -rf "$core"
          env -u GITHUB_TOKEN -u GH_TOKEN gh repo clone cwchewang/praxis-research-runtime "$core" -- --filter=blob:none --no-checkout
          git -C "$core" fetch --depth=1 origin "$PRAXIS_CORE_REF"
          git -C "$core" checkout --detach "$PRAXIS_CORE_REF"
          test "$(git -C "$core" rev-parse HEAD)" = "$PRAXIS_CORE_REF"

      - name: Prepare canonical Go2 Praxis anchor
        shell: bash
        run: |
          set -euo pipefail
          anchor="$HOME/$GO2_PRAXIS_ANCHOR_REL"
          tasks="$HOME/$GO2_PRAXIS_TASKS_REL"
          state="$HOME/$GO2_PRAXIS_STATE_REL"
          mkdir -p "$(dirname "$anchor")" "$tasks" "$state"
          {
            echo "GO2_PRAXIS_ANCHOR=$anchor"
            echo "GO2_PRAXIS_TASKS=$tasks"
            echo "GO2_PRAXIS_STATE=$state"
          } >> "$GITHUB_ENV"

          if [[ ! -e "$anchor" ]]; then
            git clone --filter=blob:none --no-checkout "$GO2_CANONICAL_REPO" "$anchor"
          fi

          test "$(git -C "$anchor" rev-parse --is-inside-work-tree)" = "true"
          actual_origin="$(git -C "$anchor" remote get-url origin)"
          test "$actual_origin" = "$GO2_CANONICAL_REPO" || {
            echo "Praxis anchor origin mismatch: $actual_origin" >&2
            exit 2
          }

          if [[ -n "$(git -C "$anchor" status --porcelain)" ]]; then
            echo "Praxis anchor is dirty; refusing to rewrite it" >&2
            git -C "$anchor" status --short >&2
            exit 2
          fi

          git -C "$anchor" fetch --prune origin
          git -C "$anchor" checkout -B main origin/main
          test "$(git -C "$anchor" rev-parse HEAD)" = "$(git -C "$anchor" rev-parse origin/main)"
          test -s "$anchor/.atlas/project.json"
          test -f "$anchor/tools/atlas_research_task_v6.py"

      - name: Build explicit Go2 project profile
        shell: bash
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/go2-project.json"
          python3 - "$GO2_PRAXIS_ANCHOR/.atlas/project.json" "$config" <<'PY'
          import json
          import os
          import sys

          source, target = sys.argv[1:]
          with open(source, encoding="utf-8") as handle:
              data = json.load(handle)

          worker = data.setdefault("worker", {})
          env = worker.setdefault("environment", {})
          env.update(
              {
                  "GO2_ATLAS_REPO": os.environ["GO2_PRAXIS_ANCHOR"],
                  "GO2_AGENT_WORKTREE_ROOT": os.environ["GO2_PRAXIS_TASKS"],
                  "GO2_AGENT_STATE_ROOT": os.environ["GO2_PRAXIS_STATE"],
                  "GO2_RESEARCH_WORKER_LOCK": "/tmp/atlas-host-live.lock",
              }
          )

          with open(target, "w", encoding="utf-8") as handle:
              json.dump(data, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY
          test -s "$config"

      - name: Run central Praxis dispatch core
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          core="$RUNNER_TEMP/praxis-core"
          config="$RUNNER_TEMP/go2-project.json"
          mkdir -p "$RUNNER_TEMP/praxis-dispatch"
          PYTHONPATH="$core" \
            python3 -m research_orchestrator.atlas_core.cli dispatch \
              --repository "$GITHUB_REPOSITORY" \
              --repo-root "$GO2_PRAXIS_ANCHOR" \
              --core-root "$core" \
              --config "$config" \
              --output-root "$RUNNER_TEMP/praxis-dispatch"

      - name: Upload Praxis dispatcher evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: praxis-dispatch-${{ github.run_id }}
          path: ${{ runner.temp }}/praxis-dispatch
          if-no-files-found: warn
          retention-days: 14
