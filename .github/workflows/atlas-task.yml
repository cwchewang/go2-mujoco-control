name: Praxis task dispatcher

on:
  issues:
    types: [opened, reopened, labeled]

permissions:
  contents: write
  issues: write

jobs:
  dispatch:
    if: >-
      github.event.issue.pull_request == null &&
      contains(github.event.issue.labels.*.name, 'atlas-task') &&
      (github.event.action != 'labeled' || github.event.label.name == 'atlas-task') &&
      (github.event.issue.author_association == 'OWNER' ||
       github.event.issue.author_association == 'MEMBER' ||
       github.event.issue.author_association == 'COLLABORATOR')
    uses: cwchewang/praxis-research-runtime/.github/workflows/atlas-dispatch-reusable.yml@324d5d2bddcffb5b8c7efda067b568a1f00e4032
    with:
      project-config: .atlas/project.json
      core-ref: 1594778e2a15a8fe9dcee8b4985d971a8d5110b2
