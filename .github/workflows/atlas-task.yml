name: Atlas task dispatcher

on:
  issues:
    types: [opened]

# The workflow checks out only trusted main code. Issue bodies are data, never
# shell. GitHub write credentials are exposed only to the post-agent push/state
# steps, never to Codex/Luna.
permissions:
  contents: write
  issues: write

concurrency:
  group: atlas-task-runner
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event.issue.pull_request == null &&
      contains(github.event.issue.labels.*.name, 'atlas-task') &&
      (
        github.event.issue.author_association == 'OWNER' ||
        github.event.issue.author_association == 'MEMBER' ||
        github.event.issue.author_association == 'COLLABORATOR'
      )
    runs-on: [self-hosted, linux, x64, atlas]
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Add user-local binaries to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Mark Atlas task running
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/atlas_issue_state.py --event "$GITHUB_EVENT_PATH" --state running

      - name: Run fixed Atlas dispatcher
        run: |
          mkdir -p "$RUNNER_TEMP/atlas-result"
          python3 tools/atlas_dispatch_v2.py \
            --event "$GITHUB_EVENT_PATH" \
            --output-dir "$RUNNER_TEMP/atlas-result"

      - name: Push validated research result
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          request="$RUNNER_TEMP/atlas-result/research-push.json"
          if [[ -f "$request" ]]; then
            result_commit="$(
              python3 tools/atlas_push_research_result.py --request "$request"
            )"
            {
              printf '\n## Trusted push\n\n'
              printf -- '- Result commit: `%s`\n' "$result_commit"
            } >> "$RUNNER_TEMP/atlas-result/summary.md"
          fi

      - name: Upload Atlas result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: atlas-issue-${{ github.event.issue.number }}
          path: ${{ runner.temp }}/atlas-result
          if-no-files-found: error
          retention-days: 14

      - name: Mark Atlas task complete
        if: success()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/atlas_issue_state.py \
            --event "$GITHUB_EVENT_PATH" \
            --state complete \
            --summary-file "$RUNNER_TEMP/atlas-result/summary.md"

      - name: Mark Atlas task failed
        if: failure()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/atlas_issue_state.py \
            --event "$GITHUB_EVENT_PATH" \
            --state failed \
            --summary-file "$RUNNER_TEMP/atlas-result/summary.md"
