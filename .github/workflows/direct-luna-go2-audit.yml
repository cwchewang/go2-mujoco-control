name: Direct Luna Go2 state audit

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  audit:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.issue.title == 'Run Luna Go2 actual-state audit direct' &&
      github.event.issue.author_association == 'OWNER'
    runs-on: [self-hosted, linux, x64, atlas]
    timeout-minutes: 90
    env:
      AUDIT_BRANCH: research/praxis-go2-state-audit-20260919
      AUDIT_TASK: docs/research/TASK_PRAXIS_GO2_STATE_AUDIT_20260919.md
      AUDIT_COMMIT: a7dece2f19a04680cdc2de9db13bf2b7e5c4de42
    steps:
      - name: Checkout trusted Go2 main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify frozen audit task
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$AUDIT_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$AUDIT_COMMIT"
          git cat-file -e "$AUDIT_COMMIT^{commit}"
          git show "$AUDIT_COMMIT:$AUDIT_TASK" >/dev/null

      - name: Let Luna independently audit Atlas and Go2
        shell: bash
        env:
          GO2_ATLAS_REPO: ${{ github.workspace }}
          GO2_AGENT_WORKTREE_ROOT: ${{ runner.temp }}/go2-audit-worktrees
          GO2_AGENT_STATE_ROOT: ${{ runner.temp }}/go2-audit-state
          GO2_RESEARCH_WORKER_LOCK: ${{ runner.temp }}/go2-audit.lock
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p "$RUNNER_TEMP/go2-audit"
          env -u GITHUB_TOKEN -u GH_TOKEN -u ACTIONS_RUNTIME_TOKEN             python3 tools/atlas_research_task_v6.py               --branch "$AUDIT_BRANCH"               --task-path "$AUDIT_TASK"               --task-commit "$AUDIT_COMMIT"               --output-dir "$RUNNER_TEMP/go2-audit"

      - name: Trusted push of Luna audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          request="$RUNNER_TEMP/go2-audit/research-push.json"
          test -s "$request"
          python3 tools/atlas_push_research_result.py --request "$request"

      - name: Upload audit execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: direct-luna-go2-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/go2-audit
          if-no-files-found: warn
          retention-days: 14
