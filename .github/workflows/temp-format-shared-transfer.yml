name: Temporary shared-transfer formatter

on:
  push:
    branches:
      - research/shared-transfer-combination-rebase-20260923

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: research/shared-transfer-combination-rebase-20260923
      - run: python3 -m pip install ruff==0.12.12
      - run: |
          python3 -m ruff format             tools/substrate/baseline.py             tools/substrate/baseline_verify.py             tools/substrate/test_baseline.py
      - run: |
          if git diff --quiet --             tools/substrate/baseline.py             tools/substrate/baseline_verify.py             tools/substrate/test_baseline.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/substrate/baseline.py tools/substrate/baseline_verify.py tools/substrate/test_baseline.py
          git commit -m "style: apply Ruff formatting to shared-transfer implementation"
          git push origin HEAD:research/shared-transfer-combination-rebase-20260923
