name: Remote bootstrap physics runner

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  bootstrap:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.issue.title == 'Atlas remote bootstrap physics runner' &&
      github.event.issue.author_association == 'OWNER'
    runs-on: [self-hosted, linux, x64, atlas]
    timeout-minutes: 20
    steps:
      - name: Bootstrap second repository runner without exposing credentials
        shell: bash
        env:
          TARGET_REPO: kairoi-k/physics-knowledge-for-control
          TARGET_NAME: atlas-physics
          RUNNER_VERSION: "2.337.0"
        run: |
          set -euo pipefail
          umask 077
          target_dir="$HOME/actions-runners/physics-knowledge-for-control"
          mkdir -p "$target_dir"

          if ! command -v gh >/dev/null 2>&1; then
            echo "ATLAS_BOOTSTRAP_RESULT=NO_GH_CLI"
            exit 21
          fi
          if ! gh auth status -h github.com >/dev/null 2>&1; then
            echo "ATLAS_BOOTSTRAP_RESULT=NO_PERSISTENT_GITHUB_AUTH"
            exit 22
          fi

          token_file="$(mktemp)"
          meta=""
          archive=""
          cleanup() {
            rm -f "$token_file"
            [ -z "$meta" ] || rm -f "$meta"
            [ -z "$archive" ] || rm -f "$archive"
          }
          trap cleanup EXIT

          if ! gh api --method POST "repos/$TARGET_REPO/actions/runners/registration-token" --jq .token >"$token_file" 2>/dev/null; then
            echo "ATLAS_BOOTSTRAP_RESULT=NO_TARGET_RUNNER_ADMIN_PERMISSION"
            exit 23
          fi
          test -s "$token_file"

          if [ ! -x "$target_dir/run.sh" ]; then
            asset="actions-runner-linux-x64-$RUNNER_VERSION.tar.gz"
            meta="$(mktemp)"
            archive="$(mktemp)"
            curl -fsSL "https://api.github.com/repos/actions/runner/releases/tags/v$RUNNER_VERSION" -o "$meta"
            python3 -c 'import hashlib,json,sys,urllib.request; meta,name,out=sys.argv[1:]; data=json.load(open(meta)); a=next(x for x in data["assets"] if x["name"]==name); open(out,"wb").write(urllib.request.urlopen(a["browser_download_url"]).read()); d=a.get("digest"); actual="sha256:"+hashlib.sha256(open(out,"rb").read()).hexdigest(); (not d or actual==d) or (_ for _ in ()).throw(SystemExit("runner archive digest mismatch"))' "$meta" "$asset" "$archive"
            tar -xzf "$archive" -C "$target_dir"
          fi

          cd "$target_dir"
          if [ -f .runner ]; then
            ./config.sh remove --token "$(cat "$token_file")" >/dev/null 2>&1 || true
          fi
          ./config.sh --unattended --replace --url "https://github.com/$TARGET_REPO" --token "$(cat "$token_file")" --name "$TARGET_NAME" --labels atlas --work _work >/dev/null

          persistence=""
          if sudo -n true >/dev/null 2>&1; then
            sudo -n ./svc.sh install "$(id -un)" >/dev/null 2>&1 || true
            sudo -n ./svc.sh start >/dev/null
            persistence="system-service"
          elif systemctl --user show-environment >/dev/null 2>&1; then
            unit_dir="$HOME/.config/systemd/user"
            unit="$unit_dir/actions-runner-physics.service"
            mkdir -p "$unit_dir"
            printf '%s\n' \
              '[Unit]' \
              'Description=GitHub Actions Runner - physics-knowledge-for-control' \
              'After=network-online.target' \
              '' \
              '[Service]' \
              'Type=simple' \
              "WorkingDirectory=$target_dir" \
              "ExecStart=$target_dir/run.sh" \
              'Restart=always' \
              'RestartSec=5' \
              '' \
              '[Install]' \
              'WantedBy=default.target' >"$unit"
            systemctl --user daemon-reload
            systemctl --user enable --now actions-runner-physics.service
            persistence="user-systemd"
          else
            ( export RUNNER_TRACKING_ID=""; nohup ./run.sh >"$target_dir/runner.log" 2>&1 </dev/null & )
            persistence="nohup-current-session"
          fi

          sleep 5
          echo "ATLAS_BOOTSTRAP_RESULT=REGISTERED"
          echo "ATLAS_BOOTSTRAP_PERSISTENCE=$persistence"
